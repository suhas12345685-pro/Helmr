name: Marketplace security

# Runs on any PR that touches marketplace submissions. It validates manifests,
# security-scans every submission, runs the contract tests, performs a dry-run
# install (modelled, never executing untrusted code), comments the scan report
# on the PR, labels the PR, and blocks merge when a critical/high finding is
# present.

on:
  pull_request:
    paths:
      - 'marketplace/**'
      - 'packages/marketplace-submissions/**'
      - 'packages/security-scanner/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: marketplace-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Validate, scan & test submissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build:ts

      - name: Unit tests for scanner & submissions
        run: |
          node --test "dist/packages/security-scanner/**/*.test.js" \
                      "dist/packages/marketplace-submissions/**/*.test.js"

      - name: Run marketplace security gate
        id: gate
        # Does NOT fail the step itself, so we can still comment + label even on a
        # failed scan. The explicit "block merge" step below enforces the gate.
        continue-on-error: true
        env:
          MARKETPLACE_COMMENT_FILE: ${{ github.workspace }}/marketplace-scan-comment.md
        run: node scripts/marketplace-pr-scan.mjs

      - name: Comment scan report on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.COMMENT_FILE || 'marketplace-scan-comment.md';
            let body = '## 🛡️ Helmr marketplace security review\n\n(no report produced)';
            try { body = fs.readFileSync(path, 'utf8'); } catch {}
            const marker = '<!-- helmr-marketplace-scan -->';
            body = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          COMMENT_FILE: ${{ github.workspace }}/marketplace-scan-comment.md

      - name: Apply labels
        if: always() && github.event_name == 'pull_request' && steps.gate.outputs.labels != ''
        uses: actions/github-script@v7
        with:
          script: |
            const labels = process.env.LABELS.split(',').map((s) => s.trim()).filter(Boolean);
            if (labels.length === 0) return;
            const { owner, repo } = context.repo;
            await github.rest.issues.addLabels({
              owner, repo, issue_number: context.issue.number, labels,
            });
        env:
          LABELS: ${{ steps.gate.outputs.labels }}

      - name: Block merge on critical/high findings
        if: steps.gate.outputs.blocked == 'true'
        run: |
          echo "::error::Marketplace security gate failed — critical/high findings present. Merge blocked."
          exit 1
